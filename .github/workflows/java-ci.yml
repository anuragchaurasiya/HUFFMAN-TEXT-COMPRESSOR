name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Compile application and regression checks
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out \
            src/HuffmanCompressor/HuffmanCompressor.java \
            test/HuffmanCompressor/HuffmanCompressorTest.java

      - name: Run regression checks
        run: java -cp out HuffmanCompressor.HuffmanCompressorTest
